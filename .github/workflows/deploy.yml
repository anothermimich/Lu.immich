name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: ["main"] # Se o seu branch principal chamar "master", troque aqui
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # Salva o resultado do eleventy-img entre os deploys
      - name: Cache das imagens otimizadas
        uses: actions/cache@v4
        with:
          path: _site/img
          key: ${{ runner.os }}-eleventy-img-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eleventy-img-

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
